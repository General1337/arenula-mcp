name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install and build
        run: npm run setup

      # Pure static analysis of ToolRegistry.cs against the handlers — needs no s&box
      # install and no .NET, so it runs here rather than only on a dev machine. Catches
      # a tool advertising parameters its handler ignores, or reading ones it never
      # declared; neither is a compile error and neither throws at runtime.
      - name: Check MCP tool contracts
        run: npm run check-contracts
